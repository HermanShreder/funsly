<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Exclusive Content</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#0f0f0f;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;overflow:hidden}
.card{position:relative;width:100%;max-width:360px;aspect-ratio:9/16;border-radius:20px;overflow:hidden;background:#1a1a1a;box-shadow:0 20px 60px rgba(0,0,0,.8);margin-bottom:30px}
.video-bg{position:absolute;inset:0;background:linear-gradient(180deg,#1a1a1a 0%,#2d1b3d 50%,#1a1a1a 100%);display:flex;align-items:center;justify-content:center}
.play-icon{width:80px;height:80px;background:rgba(255,255,255,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);animation:pulse 2s infinite}
.play-icon svg{width:36px;height:36px;fill:#fff;margin-left:6px}
.overlay{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.9) 0%,transparent 50%);display:flex;flex-direction:column;justify-content:flex-end;padding:24px}
.badge{position:absolute;top:16px;left:16px;background:rgba(255,59,48,.9);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;letter-spacing:.5px;text-transform:uppercase;z-index:5}
.title{font-size:20px;font-weight:700;margin-bottom:6px;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.subtitle{font-size:13px;color:rgba(255,255,255,.7);margin-bottom:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;background:linear-gradient(135deg,#ff3b30,#ff6b6b);color:#fff;border:none;border-radius:16px;font-size:17px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:0 8px 30px rgba(255,59,48,.4);animation:ctaPulse 2s infinite;text-transform:uppercase;letter-spacing:.5px;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn svg{width:22px;height:22px;fill:#fff}
.status{margin-top:20px;font-size:11px;color:rgba(255,255,255,.4);letter-spacing:.5px}

/* iOS Buttons */
.ios-buttons{display:none;flex-direction:column;gap:12px;width:100%;margin-top:12px}
.ios-buttons.active{display:flex}
.external-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;color:#fff;border:none;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;text-decoration:none;text-transform:uppercase;letter-spacing:.5px;transition:transform .1s}
.external-btn:active{transform:scale(.97)}
.external-btn svg{width:20px;height:20px;fill:#fff}
.btn-safari{background:linear-gradient(135deg,#007AFF,#5AC8FA);box-shadow:0 6px 20px rgba(0,122,255,.4)}
.btn-chrome{background:linear-gradient(135deg,#FF9500,#FFCC00);box-shadow:0 6px 20px rgba(255,149,0,.4)}

@keyframes pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.1);opacity:1}}
@keyframes ctaPulse{0%,100%{box-shadow:0 8px 30px rgba(255,59,48,.4)}50%{box-shadow:0 8px 50px rgba(255,59,48,.7)}}
</style>
</head>
<body>

<div class="card">
    <div class="video-bg">
        <div class="play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    </div>
    <div class="badge">🔞 Exclusive</div>
    <div class="overlay">
        <div class="title">Mommy Ashley 🔥</div>
        <div class="subtitle">Full video available now • Tap to watch</div>
    </div>
</div>

<!-- Android / Desktop button -->
<button class="btn" id="mainBtn">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    Watch Full Video
</button>

<!-- iOS buttons (Safari + Chrome) -->
<div class="ios-buttons" id="iosButtons">
    <a href="https://fansly.com/mommy_ashley_ts/t1" target="_blank" rel="noopener noreferrer" class="external-btn btn-safari" id="safariBtn">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        Open in Safari
    </a>
    <a href="#" class="external-btn btn-chrome" id="chromeBtn">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
        Open in Chrome
    </a>
</div>

<div class="status" id="status"></div>

<!-- Meta Pixel -->
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init','1575630377491379');
fbq('track','PageView');
</script>

<script>
var FANSLY_URL = 'https://fansly.com/mommy_ashley_ts/t1';
var TG_TOKEN = '8875182169:AAH-EYO8mDSgFJUhJXcpRAcN5u0xWyqqG9M';
var TG_CHAT = '5253808709';

var ua = navigator.userAgent || '';
var isIOS = /iPhone|iPad|iPod/i.test(ua);
var isAndroid = /Android/i.test(ua);
var device = isIOS ? 'iOS' : (isAndroid ? 'Android' : 'Desktop');

var isInApp = false;
var inAppBrowser = 'External Browser';
if (/FBAN|FBAV|FB_IAB|FBIOS/i.test(ua)) { isInApp = true; inAppBrowser = 'Facebook In-App'; }
else if (/Instagram/i.test(ua)) { isInApp = true; inAppBrowser = 'Instagram In-App'; }
else if (/Messenger/i.test(ua)) { isInApp = true; inAppBrowser = 'Messenger In-App'; }
else if (/TikTok/i.test(ua)) { isInApp = true; inAppBrowser = 'TikTok In-App'; }
else if (/Snapchat/i.test(ua)) { isInApp = true; inAppBrowser = 'Snapchat In-App'; }
else if (/Telegram/i.test(ua)) { isInApp = true; inAppBrowser = 'Telegram In-App'; }
else if (/Twitter|X\.com/i.test(ua)) { isInApp = true; inAppBrowser = 'Twitter/X In-App'; }
else if (navigator.userAgentData && navigator.userAgentData.brands) {
    if (navigator.userAgentData.brands.some(function(b){ return b.brand === "Android WebView"; })) {
        isInApp = true; inAppBrowser = 'Android WebView';
    }
}

var visitorId = localStorage.getItem('vid');
if (!visitorId) {
    visitorId = (typeof crypto !== 'undefined' && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36);
    try { localStorage.setItem('vid', visitorId); } catch(e) {}
}

var UV_KEY = '_ash_uv';
var isUniqueVisit = false;
try { if (!localStorage.getItem(UV_KEY)) { localStorage.setItem(UV_KEY, '1'); isUniqueVisit = true; } } catch(e) {}
document.getElementById('status').textContent = isUniqueVisit ? '✦ new visit' : 'returning visitor';

// Показываем iOS кнопки только на iOS
if (isIOS) {
    document.getElementById('iosButtons').classList.add('active');
    document.getElementById('mainBtn').style.display = 'none';
}

function sendTG(text) {
    var url = 'https://api.telegram.org/bot' + TG_TOKEN + '/sendMessage';
    var body = JSON.stringify({ chat_id: TG_CHAT, text: text, parse_mode: 'HTML' });
    if (navigator.sendBeacon) {
        navigator.sendBeacon(url, new Blob([body], { type: 'application/json' }));
    } else {
        fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true }).catch(function(){});
    }
}

function logEvent(action, extra) {
    var msg = '🔔 <b>' + action + '</b>\n\n' +
        '📱 <b>Device:</b> ' + device + '\n' +
        '🌐 <b>Browser:</b> ' + inAppBrowser + '\n' +
        '🆔 <b>Visitor:</b> ' + visitorId.substring(0, 8) + '...\n' +
        '📐 <b>Screen:</b> ' + screen.width + 'x' + screen.height + '\n' +
        '🗣 <b>Lang:</b> ' + (navigator.language || '?') + '\n' +
        '🔗 <b>Referrer:</b> ' + (document.referrer || 'Direct') + '\n' +
        '🕐 <b>Time:</b> ' + new Date().toISOString().slice(0, 19);
    if (extra) msg += '\n📝 <b>Details:</b> ' + extra;
    if (action === 'PAGE_LOAD') msg += '\n\n🤖 <b>Full UA:</b>\n<code>' + ua.substring(0, 500) + '</code>';
    sendTG(msg);
}

logEvent(isUniqueVisit ? 'UNIQUE_VISIT' : 'RETURN_VISIT', 'InApp: ' + isInApp);

// --- iOS Safari Button ---
document.getElementById('safariBtn').addEventListener('click', function() {
    if (typeof fbq === 'function') {
        fbq('track', 'Lead', { content_name: 'fansly_redirect', source: 'ios_safari' });
    }
    logEvent('IOS_SAFARI_CLICK', 'Opening Fansly in Safari');
});

// --- iOS Chrome Button ---
document.getElementById('chromeBtn').addEventListener('click', function(e) {
    e.preventDefault();

    if (typeof fbq === 'function') {
        fbq('track', 'Lead', { content_name: 'fansly_redirect', source: 'ios_chrome' });
    }
    logEvent('IOS_CHROME_CLICK', 'Attempting googlechrome:// scheme');

    var cleanUrl = FANSLY_URL.replace("https://", "").replace("http://", "");
    window.location.href = "googlechrome://" + cleanUrl;

    // Фоллбек: если Chrome не установлен или схема заблокирована
    setTimeout(function() {
        if (document.visibilityState === 'visible') {
            logEvent('IOS_CHROME_FALLBACK', 'Chrome scheme failed, opening HTTPS');
            window.location.href = FANSLY_URL;
        }
    }, 800);
});

// --- Android / Desktop Button ---
var clicked = false;
document.getElementById('mainBtn').addEventListener('click', function(e) {
    e.preventDefault();
    if (clicked) return;
    clicked = true;

    if (typeof fbq === 'function') {
        fbq('track', 'Lead', { content_name: 'fansly_redirect', source: 'main_button' });
    }
    logEvent('BUTTON_CLICK', 'Source: MAIN_BUTTON | InApp: ' + isInApp);

    var btn = this;
    btn.innerHTML = '⏳ Opening...';
    btn.style.opacity = '0.7';

    setTimeout(function() {
        if (device === 'Android' && isInApp) {
            var cleanUrl = FANSLY_URL.replace("https://", "").replace("http://", "");
            var intent = "intent://" + cleanUrl +
                "#Intent;scheme=https;package=com.android.chrome;" +
                "S.browser_fallback_url=" + encodeURIComponent(FANSLY_URL) + ";end";
            window.location.href = intent;
            setTimeout(function() {
                if (document.visibilityState === 'visible') {
                    window.location.href = FANSLY_URL;
                }
            }, 2000);
        } else {
            window.location.replace(FANSLY_URL);
        }
    }, 300);
});
</script>
</body>
</html>
